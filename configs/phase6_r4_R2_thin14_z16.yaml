# Phase 6 Round 4 / EXP-10 rung R2 -- "thin 1/4" lane repair.
#
# Construction is byte-comparable to configs/phase6_combo_danc_l14f1.yaml EXCEPT
# the single `lane_hidden: 16` knob (base config keeps it at the default 32).
# Proved by scripts/phase6_round4_isolation_check.py, not asserted here.
#
# Cost (measured, scripts/phase6_round4_cost_model.py):
#   0.1926M params / 1.1656 GFLOPs   ->  +0.0860G vs the 1/8 lean baseline (+8.0%)
#   (compare the "obvious" rung R1 = l14f1: +0.5595G, +51.8%)
#
# Pre-registered prediction: resolution (1/8 -> 1/4) is live, head width is dead
# (lch64 20ep lane_fg +0.0004; TLP 58x params -> +0.031 lane_mIoU), therefore a
# thin 1/4 head should retain most of R1's lane gain at ~1/7 of its cost.
model:
  encoder:
    stem: 16
    stages: [32, 64, 96, 128]
    blocks: [2, 2, 2]
  representation:
    z_channels: 16
  detection:
    nc: 1
    from_z: true
    z_proj: true
    det_ch: 32
    anchors: &id001
      - [[9, 8], [18, 15], [32, 24]]
      - [[49, 38], [80, 52], [65, 102]]
      - [[124, 82], [166, 136], [237, 214]]
  segmentation:
    hidden: 32
    lane_res: 4
    lane_use_f1: true
    lane_hidden: 16
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 20
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
  anchors: *id001
data:
  root: data/bdd100k

# Phase 6 Round 4 / EXP-10 rung R3 -- "minimum-cost 1/4" lane repair.
#
# Single-variable vs configs/phase6_combo_danc_l14f1.yaml: `lane_hidden: 8`.
#
# Cost (measured): 0.1896M params / 1.0174 GFLOPs
#   -> -0.0622G vs the 1/8 lean baseline, i.e. the 1/4 operating resolution is
#      obtained with FEWER FLOPs than the 1/8 stock head (4x pixels x 1/4 width).
#      This is the "reduce ineffective compute instead of adding compute" rung
#      (Architecture Design Rule 2). It is also why the lane repair can be made
#      budget-negative rather than budget-additive.
model:
  encoder:
    stem: 16
    stages: [32, 64, 96, 128]
    blocks: [2, 2, 2]
  representation:
    z_channels: 16
  detection:
    nc: 1
    from_z: true
    z_proj: true
    det_ch: 32
    anchors: &id001
      - [[9, 8], [18, 15], [32, 24]]
      - [[49, 38], [80, 52], [65, 102]]
      - [[124, 82], [166, 136], [237, 214]]
  segmentation:
    hidden: 32
    lane_res: 4
    lane_use_f1: true
    lane_hidden: 8
input_size: [640, 640]
train:
  stage: A
  train_split: tri_train
  batch_size: 16
  num_workers: 2
  epochs: 20
  lr: 1e-3
  weight_decay: 5e-4
  lambda_da: 1.0
  lambda_lane: 1.0
  lambda_budget: 0.0
  grad_clip: 10.0
  anchors: *id001
data:
  root: data/bdd100k
